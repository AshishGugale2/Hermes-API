<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPO Alert</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f6fb; font-family:Arial, Helvetica, sans-serif; color:#0f172a;">
    <div style="max-width:640px; margin:32px auto; background:#ffffff; border:1px solid #dfe7f1; border-radius:14px; overflow:hidden; box-shadow:0 12px 28px rgba(15, 23, 42, 0.06);">
        <div style="background:linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%); padding:28px 32px; color:#ffffff;">
            <div style="font-size:11px; letter-spacing:1.6px; text-transform:uppercase; opacity:0.9;">IPO Alert</div>
            <h1 style="margin:12px 0 0; font-size:32px; line-height:1.2; font-weight:700;">__COMPANY__</h1>
        </div>

        <div style="padding:32px;">
            <p style="margin:0 0 20px; font-size:16px; line-height:1.6; color:#334155;">
                A subscription threshold has been reached for <strong>__COMPANY__</strong>.
            </p>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; overflow:hidden;">
                <tr>
                    <td style="padding:14px 16px; width:42%; font-size:13px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:#475569; background:#eef4ff; border-bottom:1px solid #e2e8f0;">Trigger</td>
                    <td style="padding:14px 16px; font-size:16px; font-weight:700; color:#0f172a; border-bottom:1px solid #e2e8f0;">__TRIGGER__</td>
                </tr>
                <tr>
                    <td style="padding:14px 16px; width:42%; font-size:13px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:#475569; background:#eef4ff;">Closing date</td>
                    <td style="padding:14px 16px; font-size:16px; color:#0f172a;">__CLOSING_DATE__</td>
                </tr>
            </table>

            <p style="margin:24px 0 0; font-size:14px; line-height:1.7; color:#475569;">
                This alert was generated automatically by the Hermes IPO Monitor to support timely review of subscription activity.
            </p>
        </div>

        <div style="padding:16px 32px 28px; background:#f8fafc; border-top:1px solid #e2e8f0; font-size:12px; color:#64748b; text-align:left;">
            Hermes IPO Monitor · Automated Market Alert
        </div>
    </div>
</body>
</html>
