[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-api"
version = "0.2.0"
description = "IPO monitoring and email alert API"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
hermes-scheduler = "app.jobs.scheduler:main"
hermes-refresh = "app.jobs.refresh:main"
hermes-migrate = "scripts.migrate:main"
hermes-import-sqlite = "scripts.migrate_sqlite:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.setuptools.data-files]
"share/hermes-api/migrations" = ["migrations/db.changelog.xml"]
"share/hermes-api/migrations/sql" = ["migrations/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
