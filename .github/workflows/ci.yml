name: Backend CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hermes_test
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hermes -d hermes_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql://hermes:test-password@localhost:5432/hermes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install application and test tools
        run: pip install -e '.[dev]'
      - name: Install Liquibase
        run: |
          mkdir -p "$RUNNER_TEMP/liquibase"
          curl -fL --retry 3 https://github.com/liquibase/liquibase/releases/download/v4.33.0/liquibase-4.33.0.tar.gz | tar xz -C "$RUNNER_TEMP/liquibase"
          echo "$RUNNER_TEMP/liquibase" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t hermes-api:ci .
